name: PHP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring
        coverage: none

    - name: Check syntax
      run: php -l index.php

    - name: Smoke test
      run: |
        php -S 127.0.0.1:8000 -t . &
        sleep 2
        curl -fsS http://127.0.0.1:8000/index.php | grep -q "It works"